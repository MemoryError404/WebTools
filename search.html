<!DOCTYPE html>
<html>
<head>
    <title>CSV Search</title>
</head>
<body>

<style>
  table { border-collapse: collapse; width: 100%; }
  td { border: 1px solid #aaa; padding: 6px; }
  tr:nth-child(even) { background-color: #f9f9f9; }
</style>

<!-- 勾選區（在頂部） -->
<div id="searchbox">
    <input type="text" placeholder="請輸入關鍵字" onchange="window.location.href=`${window.location.pathname}?q=${this.value}`">
</div>
<div id="sources"></div>
<div id="search_cols" style="margin-top: 8px;">搜尋欄位：</div>
<hr>
<div id="result"></div>

<script>
const params = new URLSearchParams(location.search);
const keyword = params.get("q") || "";

/* CSV 來源清單（自己加） */
const csvSources = [
    {
        name: "民國88年國語一字多音審訂表_僅審定音",
        url: "https://raw.githubusercontent.com/g0v/moedict-data-csld/refs/heads/master/%E5%9C%8B%E8%AA%9E%E4%B8%80%E5%AD%97%E5%A4%9A%E9%9F%B3%E5%AF%A9%E8%A8%82%E8%A1%A81999.csv"
    },
    {
        name: "民國88國語一字多音審訂表",
        url: "https://raw.githubusercontent.com/MemoryError404/WebTools/refs/heads/main/src/%E6%B0%91%E5%9C%8B88%E5%B9%B4%E5%9C%8B%E8%AA%9E%E4%B8%80%E5%AD%97%E5%A4%9A%E9%9F%B3%E5%AF%A9%E8%A8%82%E8%A1%A8.csv"
    },
    {
        name: "101年國語一字多音審訂表初稿_僅審定音",
        url: "https://raw.githubusercontent.com/g0v/moedict-data-csld/refs/heads/master/%E5%9C%8B%E8%AA%9E%E4%B8%80%E5%AD%97%E5%A4%9A%E9%9F%B3%E5%AF%A9%E8%A8%82%E8%A1%A82012.csv"
    },
    {
        name: "101年國語一字多音審訂表初稿",
        url: "https://raw.githubusercontent.com/MemoryError404/WebTools/refs/heads/main/src/%E6%B0%91%E5%9C%8B101%E5%B9%B4%E5%9C%8B%E8%AA%9E%E4%B8%80%E5%AD%97%E5%A4%9A%E9%9F%B3%E5%AF%A9%E8%A8%82%E8%A1%A8%E5%88%9D%E7%A8%BF.csv"
    }
];

const sourceDiv = document.getElementById("sources");
const resultDiv = document.getElementById("result");
const colDiv = document.getElementById("search_cols");

let csvData = [];

/* 產生頂部勾選框（預設勾第一個） */
csvSources.forEach((src, i) => {
    const label = document.createElement("label");
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = (i === 1);
    cb.dataset.index = i;
    cb.onchange = showResult;

    label.appendChild(cb);
    label.append(" " + src.name);
    sourceDiv.appendChild(label);
    sourceDiv.appendChild(document.createElement("br"));
});

/* 載入所有 CSV */
Promise.all(
    csvSources.map(src =>
        fetch(src.url)
        .then(r => r.text())
        .then(text => text.trim().split("\n").map(line => line.split(",")))
  )
).then(allData => {
    csvData = allData;

  // 找出最大欄位數
    let maxCols = 0;
    allData.forEach(rows => {
        if (rows.length > 0) maxCols = Math.max(maxCols, rows[0].length);
    });

  // 產生欄位勾選框
  for (let i = 0; i < maxCols; i++) {
    const label = document.createElement("label");
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.value = i;
    cb.checked = (i === 1); // 預設維持原行為：勾選第二欄
    cb.onchange = showResult;
    label.appendChild(cb);
    label.append(` 第${i + 1}欄 `);
    colDiv.appendChild(label);
  }

  showResult();
});

function showResult() {
    if (!keyword) {
        resultDiv.textContent = "請用 ?q=關鍵字 查詢";
        return;
    }

    const targetCols = Array.from(colDiv.querySelectorAll("input:checked")).map(cb => parseInt(cb.value));

    let html = "<table>";
    let hasData = false;

    document.querySelectorAll("#sources input[type=checkbox]").forEach(cb => {
        if (!cb.checked) return;

        const i = cb.dataset.index;
        const rows = csvData[i];

        rows.forEach(r => {
            const match = targetCols.some(idx => r[idx] && r[idx].includes(keyword));
            if (match) {
            hasData = true;
            html += `<tr><td>${csvSources[i].name}</td>${r.map(c => `<td>${c.replace(/\\n/g, "<br>")}</td>`).join("")}</tr>`;
            }
        });
    });

    html += "</table>";
    resultDiv.innerHTML = hasData ? html : "找不到資料";
}
</script>

</body>
</html>
